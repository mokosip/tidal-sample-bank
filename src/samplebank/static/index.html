<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>samplebank</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">samplebank</div>
    <nav class="views">
      <button data-view="map" title="map view (m)"><kbd>m</kbd>Map</button>
      <button data-view="list" title="list view (l)"><kbd>l</kbd>List</button>
    </nav>
    <input id="search" type="search" placeholder="/  search bank, file, tag" autocomplete="off" spellcheck="false">
    <span id="count" class="count"></span>
    <span id="status" class="status"></span>
    <button id="upload-pick" class="add-btn" title="add samples — or drop files/folders anywhere">+ add</button>
    <input id="upload-input" type="file" multiple hidden>
  </header>
  <div id="banner" class="banner" hidden>SuperDirt not reachable — previews are silent. Start SuperDirt in SuperCollider; this page reconnects by itself.</div>
  <div class="filters">
    <div id="filter-types" class="chips"></div>
    <div id="filter-tags" class="chips"></div>
  </div>
  <main>
    <section id="view" class="view"></section>
    <aside id="inspector"></aside>
  </main>
  <footer class="keys">
    <span class="list-only"><kbd>j</kbd><kbd>k</kbd> move + play</span>
    <span><kbd>space</kbd> replay</span>
    <span><kbd>y</kbd> copy snippet</span>
    <span><kbd>f</kbd> star</span>
    <span><kbd>t</kbd> tags</span>
    <span><kbd>1</kbd>…<kbd>0</kbd><kbd>-</kbd> set type</span>
    <span><kbd>/</kbd> search</span>
    <span><kbd>m</kbd><kbd>l</kbd> map / list</span>
  </footer>
  <div id="toast" class="toast" hidden></div>
  <div id="drop" class="drop" hidden><div class="drop-box">drop to add samples<small>files or folders · wav aif mp3 flac ogg …</small></div></div>
  <div id="upload-modal" class="modal" hidden>
    <div id="upload-box" class="modal-box" role="dialog" aria-modal="true" aria-labelledby="upload-title">
      <div id="upload-title" class="modal-title"></div>
      <div id="upload-bank-step">
        <div id="upload-files" class="modal-files"></div>
        <div id="upload-list" class="upload-list"></div>
        <label class="insp-label" for="upload-bank">bank</label>
        <input id="upload-bank" class="modal-input" list="upload-banks" autocomplete="off" spellcheck="false">
        <datalist id="upload-banks"></datalist>
        <div id="upload-preview" class="modal-preview"></div>
        <div class="modal-row">
          <span id="upload-msg" class="modal-msg"></span>
          <button id="upload-suggest" class="modal-btn hot" hidden></button>
        </div>
        <div class="modal-row end">
          <button id="upload-cancel" class="modal-btn"><kbd>esc</kbd>cancel</button>
          <button id="upload-ok" class="modal-btn hot"><kbd>⏎</kbd>add</button>
        </div>
      </div>
      <div id="upload-trim-step" hidden>
        <div id="upload-into" class="modal-files"></div>
        <div id="upload-trim"></div>
        <div class="modal-row end trim-actions">
          <span id="upload-next" class="modal-next"></span>
          <button id="trim-cancel" class="modal-btn" title="cancel the whole upload"><kbd>esc</kbd>cancel</button>
          <button id="trim-back" class="modal-btn">‹ back</button>
          <button id="trim-skip" class="modal-btn">skip this file</button>
          <button id="trim-whole" class="modal-btn">keep whole file</button>
          <button id="trim-keep" class="modal-btn hot"><kbd>⏎</kbd>keep selection</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module">
    import { start } from "/static/app.js";
    import "/static/list.js";
    import "/static/map.js";
    import { initUpload } from "/static/upload.js";
    initUpload();
    start();
  </script>
</body>
</html>
