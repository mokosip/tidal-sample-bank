[project]
name = "samplebank"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Moritz Konschack", email = "53667624+mokosip@users.noreply.github.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.161.1",
    "librosa>=1.0.0",
    "numpy>=2.5.4",
    "python-multipart>=0.0.32",
    "python-osc>=1.10.2",
    "scikit-learn>=1.9.1",
    "umap-learn>=0.5.12",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "soundfile>=0.14.0",
]
